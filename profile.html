<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile | VYORA</title>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <!-- Early Theme Init -->
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('dark-mode');
        });
      }
    </script>
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <a href="index.html" class="mobile-logo"><span>V</span> VYORA</a>

      <div class="search-box">
        <span><i class="bi bi-search"></i></span>
        <input type="text" placeholder="Search people, posts, or topics..." />
      </div>

      <div class="nav-right">
        <button class="icon-btn theme-btn" title="Toggle Theme">
          <i class="bi bi-moon"></i>
        </button>

        <a href="notification.html" class="icon-btn notification notification-bell" title="Notifications">
          <i class="bi bi-bell"></i>
          <small>3</small>
        </a>

        <div class="user-menu">
          <div class="user-mini" id="userMenuButton">
            <img src="public/assests/images/avatars/avatar_1.jpg" alt="Avatar" />
            <span>Samia</span>
          </div>

          <div class="profile-dropdown" id="profileDropdown">
            <div class="dropdown-user">
              <img
                src="public/assests/images/avatars/avatar_1.jpg"
                id="dropdownAvatar"
                alt="Avatar"
              />

              <div>
                <h3 id="dropdownName">Samia</h3>
                <p id="dropdownUsername">@samia</p>
              </div>
            </div>

            <hr />

            <a href="profile.html"> 👤 View Profile </a>
            <a href="setting.html"> ⚙️ Settings </a>
            <button id="logoutBtn">↪ Logout</button>
          </div>
        </div>
      </div>
    </header>

    <!-- PROFILE -->
    <main class="profile-page">
      <section class="profile-card">
        <div class="profile-top">
          <img
            class="profile-avatar"
            src="public/assests/images/avatars/avatar_1.jpg"
            alt="Profile"
          />

          <div class="profile-info">
            <h1>Samia</h1>

            <p class="username">@samia</p>

            <p class="bio">Creating, learning & sharing my world ✨</p>

            <button class="edit-profile-btn">✏️ Edit Profile</button>
          </div>
        </div>

        <!-- STATS -->
        <div class="profile-stats">
          <div>
            <strong>24</strong>
            <span>Posts</span>
          </div>

          <div>
            <strong>120</strong>
            <span>Followers</span>
          </div>

          <div>
            <strong>85</strong>
            <span>Following</span>
          </div>
        </div>
      </section>

      <!-- PROFILE TABS -->
      <div class="profile-tabs">
        <button class="active">Posts</button>
        <button>Saved</button>
        <button>Tagged</button>
      </div>

      <!-- POSTS -->
      <section class="profile-posts">
        <div class="profile-post">
          <img src="public/assests/images/posts/post1.avif" alt="Post" />
        </div>

        <div class="profile-post">
          <img src="public/assests/images/posts/post2.avif" alt="Post" />
        </div>

        <div class="profile-post">
          <img src="public/assests/images/posts/post3.avif" alt="Post" />
        </div>

        <div class="profile-post">
          <img src="public/assests/images/posts/post4.avif" alt="Post" />
        </div>

        <div class="profile-post">
          <img src="public/assests/images/posts/post5.avif" alt="Post" />
        </div>

        <div class="profile-post">
          <img src="public/assests/images/posts/post1.avif" alt="Post" />
        </div>
      </section>
    </main>

    <!-- MOBILE NAV -->
    <nav class="mobile-nav">
      <a href="index.html">
        <i class="bi bi-house"></i>
        <small>Home</small>
      </a>

      <a href="explore.html">
        <i class="bi bi-search"></i>
        <small>Explore</small>
      </a>

      <a href="index.html" class="mobile-create">
        <i class="bi bi-plus"></i>
      </a>

      <a href="notification.html">
        <i class="bi bi-bell"></i>
        <small>Activity</small>
      </a>

      <a href="profile.html" class="active">
        <i class="bi bi-person"></i>
        <small>Profile</small>
      </a>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
